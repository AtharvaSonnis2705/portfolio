name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # content-collections generates types during build; build first so typecheck sees them
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://atharvasonnisportfolio.vercel.app
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Link check
        run: |
          pnpm start -p 3000 &
          pnpm exec wait-on http://localhost:3000 --timeout 60000
          pnpm linkcheck
